name: CI

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show environment
        run: |
          java -version
          make setup

      - name: Run repository checks
        run: make check
